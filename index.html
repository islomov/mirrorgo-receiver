<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorGo Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #mirrorImage {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9333EA;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 32px;
            text-align: center;
            z-index: 1000;
        }
        #youtube {
            position: absolute;
            inset: 0;
            display: none;
            background-color: black;
        }
        #youtube iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        #status.connected {
            top: 20px;
            left: 20px;
            transform: none;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="status">MirrorGo<br><span style="font-size: 18px;">Waiting for connection...</span></div>
    <img id="mirrorImage" src="" alt="Screen Mirror">
    <div id="youtube"><div id="youtubePlayer"></div></div>

    <script>
        const NAMESPACE = 'urn:x-cast:com.mirrorgo.stream';

        const context = cast.framework.CastReceiverContext.getInstance();
        const mirrorImage = document.getElementById('mirrorImage');
        const status = document.getElementById('status');

        let streamUrl = null;
        let frameCount = 0;
        let isStreaming = false;

        function showStatus(msg) {
            console.log('MirrorGo: ' + msg);
            status.style.display = '';
            status.innerHTML = 'MirrorGo<br><span style="font-size: 18px;">' + msg + '</span>';
        }

        function showConnected() {
            status.className = 'connected';
            status.textContent = 'MirrorGo: Streaming';
            setTimeout(function() { status.style.opacity = '0.5'; }, 3000);
        }

        function setImgSrc() {
            if (!streamUrl || !isStreaming) return;
            var currentTime = new Date().getTime();
            mirrorImage.src = streamUrl + '?time=' + currentTime;
        }

        mirrorImage.onload = function() {
            frameCount++;
            if (frameCount === 1) {
                mirrorImage.style.display = 'block';
                showConnected();
            }
            setImgSrc();
        };

        mirrorImage.onerror = function() {
            setTimeout(setImgSrc, 100);
        };

        // ---- App audio ----
        // The phone serves 16-bit interleaved PCM. Each request returns whatever
        // arrived after `after` (empty while Sound is off), and the chunks are
        // scheduled back to back with a small jitter buffer.
        const AUDIO_TARGET_LATENCY = 0.15; // seconds of audio buffered ahead
        const AUDIO_MAX_LATENCY = 0.5;     // drift past this resets the buffer

        let audioContext = null;
        let audioUrl = null;
        let audioSeq = -1;
        let audioGeneration = 0;
        let audioNextTime = 0;

        function startAudio(url) {
            stopAudio();
            audioUrl = url;
            audioSeq = -1;
            audioNextTime = 0;
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            }
            audioContext.resume();
            pollAudio(++audioGeneration);
        }

        function stopAudio() {
            audioGeneration++;
            audioUrl = null;
        }

        async function pollAudio(generation) {
            while (generation === audioGeneration) {
                try {
                    const response = await fetch(audioUrl + '?after=' + audioSeq, { cache: 'no-store' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const seq = parseInt(response.headers.get('X-Audio-Seq'), 10);
                    const rate = parseInt(response.headers.get('X-Audio-Rate'), 10) || 48000;
                    const channels = parseInt(response.headers.get('X-Audio-Channels'), 10) || 2;
                    const data = await response.arrayBuffer();
                    if (generation !== audioGeneration) return;
                    if (!isNaN(seq)) audioSeq = seq;
                    if (data.byteLength > 0) playPCM(data, rate, channels);
                } catch (e) {
                    if (generation !== audioGeneration) return;
                    console.warn('MirrorGo: audio request failed', e);
                    await new Promise(function(resolve) { setTimeout(resolve, 250); });
                }
            }
        }

        function playPCM(data, rate, channels) {
            const samples = new Int16Array(data, 0, Math.floor(data.byteLength / 2));
            const frames = Math.floor(samples.length / channels);
            if (frames === 0) return;

            const buffer = audioContext.createBuffer(channels, frames, rate);
            for (let c = 0; c < channels; c++) {
                const output = buffer.getChannelData(c);
                for (let i = 0; i < frames; i++) {
                    output[i] = samples[i * channels + c] / 32768;
                }
            }

            const now = audioContext.currentTime;
            if (audioNextTime < now || audioNextTime > now + AUDIO_MAX_LATENCY) {
                audioNextTime = now + AUDIO_TARGET_LATENCY;
            }
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start(audioNextTime);
            audioNextTime += buffer.duration;
        }

        // ---- YouTube ----
        // PLAY_YOUTUBE {videoId, start} plays a video in YouTube's embedded player.
        // The app hears back YOUTUBE_STARTED once it plays, YOUTUBE_ERROR {reason}
        // if it can't, and YOUTUBE_ENDED when it finished or something replaced it
        // (mirroring, a gallery item). All carry the videoId.
        const youtubeContainer = document.getElementById('youtube');
        let youtubeApi = null;
        let youtubePlayer = null;
        let youtubeVideoId = null;
        let youtubeStarted = false;

        function sendToApp(message) {
            // No sender ID: every connected sender gets it.
            context.sendCustomMessage(NAMESPACE, undefined, message);
        }

        function loadYouTubeApi() {
            if (youtubeApi) return youtubeApi;
            youtubeApi = new Promise(function(resolve, reject) {
                if (window.YT && window.YT.Player) { resolve(); return; }
                window.onYouTubeIframeAPIReady = resolve;
                const script = document.createElement('script');
                script.src = 'https://www.youtube.com/iframe_api';
                script.onerror = function() {
                    youtubeApi = null;
                    reject(new Error('Could not load YouTube.'));
                };
                document.head.appendChild(script);
            });
            return youtubeApi;
        }

        async function playYouTube(videoId, start) {
            stopMirroring();
            if (youtubeVideoId && youtubeVideoId !== videoId) {
                sendToApp({ type: 'YOUTUBE_ENDED', videoId: youtubeVideoId });
            }
            youtubeVideoId = videoId;
            youtubeStarted = false;
            showStatus('Loading YouTube...');
            try {
                await loadYouTubeApi();
            } catch (e) {
                youtubeFailed(videoId, 'Your TV couldn\'t load YouTube. Check its internet connection.');
                return;
            }
            if (youtubeVideoId !== videoId) return;  // Replaced meanwhile.

            youtubeContainer.style.display = 'block';
            if (youtubePlayer) {
                youtubePlayer.loadVideoById({ videoId: videoId, startSeconds: start });
                return;
            }
            youtubePlayer = new YT.Player('youtubePlayer', {
                width: '100%',
                height: '100%',
                videoId: videoId,
                playerVars: { autoplay: 1, start: start, controls: 0, rel: 0, playsinline: 1 },
                events: {
                    onReady: function(event) { event.target.playVideo(); },
                    onStateChange: onYouTubeStateChange,
                    onError: onYouTubeError
                }
            });
        }

        function onYouTubeStateChange(event) {
            const videoId = youtubeVideoId;
            if (!videoId) return;
            if (event.data === YT.PlayerState.PLAYING && !youtubeStarted) {
                youtubeStarted = true;
                status.style.display = 'none';
                sendToApp({ type: 'YOUTUBE_STARTED', videoId: videoId });
            } else if (event.data === YT.PlayerState.ENDED) {
                stopYouTube(true);
                showStatus('Video ended');
            }
        }

        function onYouTubeError(event) {
            const videoId = youtubeVideoId;
            if (!videoId) return;
            let reason;
            switch (event.data) {
                case 101:
                case 150:
                    reason = 'This video can\'t be played outside YouTube. Try another one.';
                    break;
                case 100:
                    reason = 'This video is private or was removed.';
                    break;
                default:
                    reason = 'Your TV couldn\'t play this video (YouTube error ' + event.data + ').';
            }
            youtubeFailed(videoId, reason);
        }

        function youtubeFailed(videoId, reason) {
            if (youtubeVideoId !== videoId) return;
            console.warn('MirrorGo: YouTube failed: ' + reason);
            hideYouTube();
            sendToApp({ type: 'YOUTUBE_ERROR', videoId: videoId, reason: reason });
            showStatus('Waiting for connection...');
        }

        // `notify`: tell the app, when something else replaces the video.
        function stopYouTube(notify) {
            const videoId = youtubeVideoId;
            if (!videoId) return;
            hideYouTube();
            if (notify) sendToApp({ type: 'YOUTUBE_ENDED', videoId: videoId });
        }

        function hideYouTube() {
            youtubeVideoId = null;
            youtubeStarted = false;
            if (youtubePlayer && youtubePlayer.stopVideo) youtubePlayer.stopVideo();
            youtubeContainer.style.display = 'none';
        }

        function stopMirroring() {
            stopAudio();
            isStreaming = false;
            streamUrl = null;
            mirrorImage.style.display = 'none';
            status.className = '';
        }

        // A gallery video (standard media LOAD) replaces the YouTube video.
        context.getPlayerManager().setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            function(request) {
                stopYouTube(true);
                return request;
            }
        );

        context.addCustomMessageListener(NAMESPACE, function(event) {
            console.log('MirrorGo: Received message:', event.data);

            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

                if (data.type === 'START_STREAM' && data.url) {
                    stopYouTube(true);
                    streamUrl = data.url;
                    isStreaming = true;
                    frameCount = 0;
                    showStatus('Connecting to stream...');
                    console.log('MirrorGo: Starting stream from:', streamUrl);
                    setImgSrc();
                    if (data.audioUrl) {
                        startAudio(data.audioUrl);
                    } else {
                        stopAudio();
                    }
                } else if (data.type === 'STOP_STREAM') {
                    stopMirroring();
                    showStatus('Stream stopped');
                } else if (data.type === 'PLAY_YOUTUBE' && data.videoId) {
                    playYouTube(String(data.videoId), Math.max(0, parseInt(data.start, 10) || 0));
                } else if (data.type === 'STOP_YOUTUBE') {
                    if (youtubeVideoId) {
                        stopYouTube(false);
                        showStatus('Waiting for connection...');
                    }
                }
            } catch (e) {
                console.error('MirrorGo: Error parsing message:', e);
            }
        });

        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.maxInactivity = 3600;
        options.customNamespaces = {};
        options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;

        showStatus('Waiting for connection...');
        context.start(options);
    </script>
</body>
</html>
