<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0e12">
  <meta name="description" content="Mirror your iPhone screen to this browser with All TV Kit.">
  <title>smrr.tv</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23755cff'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M12 25h8' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/Sora-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<!-- smrr.tv in a browser. Each MirrorGo TV app's page is its own copy in web/<tv>/ (/firetv, /samsung, /lg,
     /roku, /googletv). -->
<body data-screen="connecting">
  <video id="video" autoplay playsinline muted></video>
  <!-- Links the phone sends: web images, YouTube (videos use #video) -->
  <img id="image" alt="">
  <div id="youtube"></div>

  <!-- Connecting to the server -->
  <section class="screen center" id="screen-connecting">
    <div class="spinner" aria-hidden="true"></div>
    <p class="lead" id="connecting-text" role="status"></p>
  </section>

  <!-- The code (also: phone connected / starting, and stopped) -->
  <section class="screen" id="screen-code">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="7" y="9" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="2.5"/><path d="M12 25h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></span>
      <span id="brand"></span>
    </header>
    <main class="code-layout">
      <div class="code-main">
        <h1 id="code-title"></h1>
        <p class="hint" id="code-hint"></p>
        <div class="label" id="code-label"></div>
        <div class="code-digits" id="code" aria-live="polite"></div>
        <ol class="steps" id="steps"></ol>
        <p class="wifi" id="code-wifi"></p>
        <p class="status" id="code-status" role="status"></p>
      </div>
      <figure class="qr">
        <div class="qr-image" id="qr"></div>
        <figcaption id="qr-hint"></figcaption>
      </figure>
    </main>
    <!-- The privacy policy covers smrr.tv (mirrorgo.app/privacy). Not on the TV apps' pages: they have their own. -->
    <a class="legal" id="privacy-link" href="https://mirrorgo.app/privacy/" target="_blank" rel="noopener"></a>
  </section>

  <!-- Opened by the app on the TV (no code): connecting / starting / stopped / ended -->
  <section class="screen center" id="screen-app">
    <header class="app-brand" id="app-brand"></header>
    <div class="app-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect x="7" y="9" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="2.5"/><path d="M12 25h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
    <h1 id="app-title"></h1>
    <p class="hint" id="app-hint"></p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <button type="button" class="button" id="app-use-code" hidden></button>
    <p class="status" id="app-status" role="status"></p>
  </section>

  <!-- Errors and notices -->
  <section class="screen center" id="screen-message">
    <h1 id="message-title"></h1>
    <p class="hint" id="message-hint"></p>
    <button type="button" class="button primary" id="message-action"></button>
  </section>

  <!-- Playing -->
  <div class="toast" id="toast" role="status"></div>
  <div class="controls" id="controls">
    <button type="button" class="button primary" id="sound"></button>
    <button type="button" class="button" id="fullscreen"></button>
  </div>

  <pre class="debug" id="debug" hidden></pre>

  <script type="module" src="/app.js"></script>
  <script nomodule>
    // Browsers without ES modules can't run the player either. (The only string outside strings.js.)
    document.getElementById("connecting-text").textContent =
      "This browser can't play the mirrored screen. Try Chrome, Edge, Safari or Firefox.";
    document.querySelector(".spinner").style.display = "none";
  </script>
</body>
</html>
